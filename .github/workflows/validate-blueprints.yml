name: 🧪 Validate Blueprints & Config

on:
  push:
    branches: [ main, master ]
    paths:
      - 'config/**'
      - '*.md'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'config/**'
      - '*.md'

jobs:
  markdownlint:
    name: 📝 Lint Markdown (README)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Validation des fichiers Markdown
        uses: davidanson/markdownlint-cli2-action@v19
        with:
          globs: |
            README.md
            **/*.md

  yamllint:
    name: 🔍 Lint Syntax (Blueprints & Packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Lint des Blueprints
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: config/blueprints/
          config_data: |
            extends: relaxed
            rules:
              line-length: disable
              truthy: disable

      - name: Lint des Packages (Helpers)
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: config/packages/
          config_data: |
            extends: relaxed
            rules:
              line-length: disable
              truthy: disable

  ha_validation:
    name: 🏠 Validation Home Assistant Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Génération de la configuration HA minimale
        run: |
          echo "default_config:" > config/configuration.yaml
          echo "homeassistant: { packages: !include_dir_named packages }" >> config/configuration.yaml

      - name: Vérification de la configuration HA
        uses: frenck/action-home-assistant@v1
        with:
          path: "config"
